{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14263d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Family Circle">
    <title>{% block title %}Family Circle{% endblock %}</title>
    <link rel="manifest" href="{% static 'rewards/manifest.webmanifest' %}">
    <link rel="apple-touch-icon" href="{% static 'rewards/icon.svg' %}">
    <link rel="stylesheet" href="{% static 'rewards/styles.css' %}">
    <script defer src="{% static 'rewards/app.js' %}"></script>
  </head>
  <body>
    {% if messages %}
      <div class="messages">
        {% for message in messages %}<div class="toast {{ message.tags }}">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </body>
</html>
